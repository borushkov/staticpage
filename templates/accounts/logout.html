{% extends "base_p.html" %}

{% block title %}Выход{% endblock %}

{% block content %}
<div class="container">
    <h1>Выход из аккаунта</h1>
    <p>Вы уверены, что хотите выйти?</p>
    <form method="post" class="form">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Выйти</button>
    </form>
    <p><a href="{% url 'post_list' %}">Вернуться на главную</a></p>
</div>
{% endblock %}
